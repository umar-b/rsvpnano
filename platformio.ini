[platformio]
default_envs = waveshare_esp32s3_usb_msc

[env]
platform = espressif32@6.3.2
board = esp32-s3-r8-opi
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = pre:tools/pio_set_version.py
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRSVP_ON_DEVICE_EPUB_CONVERSION=1

[env:waveshare_esp32s3]
build_flags =
  ${env.build_flags}
  -DRSVP_USB_TRANSFER_ENABLED=0

[env:waveshare_esp32s3_usb_msc]
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_MSC_ON_BOOT=0
  -DRSVP_USB_TRANSFER_ENABLED=1
build_unflags =
  -DARDUINO_USB_MODE=1

; Debugging only: routes Arduino Serial to the USB CDC so app logs stream over
; USB. Mutually exclusive with USB-transfer (MSC), so that feature is disabled
; here. The shipping env is waveshare_esp32s3_usb_msc, not this one.
[env:debug_serial]
extends = env:waveshare_esp32s3
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DRSVP_USB_TRANSFER_ENABLED=0

[env:native_test]
platform = native
framework =
test_framework = unity
test_filter =
  test_pacing
  test_menu
  test_battery
  test_word_pacing
  test_text_decode
  test_orientation
  test_standby_decider
  test_flick_detector
  test_touch_gesture
  test_release_parser
  test_feed_parser
  test_life_grid
  test_word_rain
  test_dvd_bounce
  test_book_cover
  test_book_progress
  test_bookmarks
  test_book_text
  test_reading_stats
  test_stats_history
  test_device_clock
  test_pref_spec
  test_reading_layout
  test_jingle
  test_sprint_account
  test_burnin_jitter
  test_preview_samples
  test_library_filter
  test_menu_gesture
  test_wifi_credentials
  test_quotes
  test_ramp_in
  test_word_split
  test_achievements
  test_time_estimate
  test_context_preview
  test_epub_convert
  test_json_text
  test_block_sequencer
  test_book_index
  test_night_schedule
test_build_src = yes
build_src_filter =
  -<*>
  +<app/Menu.cpp>
  +<board/BatteryManager.cpp>
  +<reader/ReadingLoop.cpp>
  +<reader/WordPacing.cpp>
  +<reader/RampIn.cpp>
  +<reader/WordSplit.cpp>
  +<reader/TimeEstimate.cpp>
  +<reader/ContextPreview.cpp>
  +<update/ReleaseParser.cpp>
  +<rss/FeedParser.cpp>
  +<standby/LifeGrid.cpp>
  +<standby/WordRain.cpp>
  +<standby/DvdBounce.cpp>
  +<standby/BookCoverDrift.cpp>
  +<stats/ReadingStats.cpp>
  +<stats/StatsHistory.cpp>
  +<stats/Achievements.cpp>
  +<time/DeviceClock.cpp>
  +<time/NightSchedule.cpp>
  +<storage/BookProgressKeys.cpp>
  +<storage/BookIndex.cpp>
  +<text/BookText.cpp>
  +<text/TextDecode.cpp>
  +<text/EpubConvert.cpp>
  +<text/JsonText.cpp>
  +<motion/Orientation.cpp>
  +<motion/StandbyDecider.cpp>
  +<motion/FlickDetector.cpp>
  +<app/TouchGesture.cpp>
  +<library/LibraryFilter.cpp>
  +<library/MenuGesture.cpp>
  +<display/ReadingLayout.cpp>
  +<audio/Jingle.cpp>
  +<timer/SprintAccount.cpp>
  +<timer/BlockSequencer.cpp>
  +<display/BurnInJitter.cpp>
  +<text/PreviewSamples.cpp>
  +<net/WifiCredentialStore.cpp>
  +<quotes/Quote.cpp>
build_flags =
  -std=c++17
  -Itest/support
  -Isrc
